services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: movewise
      POSTGRES_PASSWORD: movewise_local
      POSTGRES_DB: movewise
    ports:
      - "5432:5432"
    volumes:
      - movewise_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movewise"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  movewise_db:
